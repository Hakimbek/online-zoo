<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Khakim Bakhramov">
    <meta name="description" content="Online ZOO">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg" href="../../assets/icons/favicon.svg">
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
    <title>Online ZOO</title>
</head>
<body>
<header class="header">
    <!-- LOGO ICON -->
    <button class="header__logo-button">
        <img src="../../assets/icons/logo.svg" alt="Logo of Online ZOO">
    </button>
    <!-- END LOGO ICON -->

    <!-- BURGER ICON -->
    <button class="header__burger-button">
        <img src="../../assets/icons/hamburger.svg" alt="Hamburger menu">
    </button>
    <!-- END BURGER ICON -->

    <!-- MOBILE NAV MENU -->
    <div class="header__menu">
        <div class="header__menu-close-wrapper">
            <button class="header__close-button">
                <img src="../../assets/icons/close.svg" alt="Hamburger menu">
            </button>
        </div>
        <nav>
            <ul class="header__nav-list">
                <li>about</li>
                <li>map</li>
                <li>zoos</li>
                <li>contact us</li>
                <li>design</li>
            </ul>
        </nav>
    </div>
    <!-- END MOBILE NAV MENU -->
</header>
</body>
</html>
