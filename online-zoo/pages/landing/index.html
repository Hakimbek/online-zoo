<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Khakim Bakhramov">
    <meta name="description" content="Online ZOO">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg" href="../../assets/icons/favicon.svg">
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
    <title>Online ZOO</title>
</head>
<body>
<!-- HEADER -->
<header class="header">
    <!-- LOGO ICON -->
    <a class="header__link" href="#">
        <img src="../../assets/icons/logo.svg" alt="Logo of Online ZOO">
    </a>
    <!-- END OF LOGO ICON -->

    <!-- BURGER ICON -->
    <button class="header__burger-btn">
        <img src="../../assets/icons/hamburger.svg" alt="Hamburger menu">
    </button>
    <!-- END OF BURGER ICON -->

    <!-- MOBILE NAV MENU -->
    <div class="header__mobile-nav">
        <div class="header__close-btn-wrapper">
            <button class="header__close-btn">
                <img src="../../assets/icons/close.svg" alt="Hamburger menu">
            </button>
        </div>
        <nav>
            <ul class="header__list">
                <li>
                    <a class="header__link" href="#">About</a>
                </li>
                <li>
                    <a class="header__link" href="#">Map</a>
                </li>
                <li>
                    <a class="header__link" href="#">Zoos</a>
                </li>
                <li>
                    <a class="header__link" href="#">Contact us</a>
                </li>
                <li>
                    <a class="header__link" href="#">Design</a>
                </li>
            </ul>
        </nav>
    </div>
    <!-- END OF MOBILE NAV MENU -->

    <!-- DESKTOP NAV MENU -->
    <div class="header__desktop-nav">
        <nav>
            <ul class="header__list">
                <li>
                    <a class="header__link" href="#">About</a>
                </li>
                <li>
                    <a class="header__link" href="#">Map</a>
                </li>
                <li>
                    <a class="header__link" href="#">Zoos</a>
                </li>
                <li>
                    <a class="header__link" href="#">Contact us</a>
                </li>
                <li>
                    <a class="header__link" href="#">Design</a>
                </li>
            </ul>
        </nav>
        <div class="header__socials">
            <a class="header__link" href="#">
                <img src="../../assets/icons/youtube.svg" alt="Logo of Youtube channel of Online ZOO">
            </a>
            <a class="header__link" href="#">
                <img src="../../assets/icons/instagram.svg" alt="Logo of Instagram account of Online ZOO">
            </a>
            <a class="header__link" href="#">
                <img src="../../assets/icons/facebook.svg" alt="Logo of Facebook page of Online ZOO">
            </a>
        </div>
    </div>
    <!-- END OF DESKTOP NAV MENU -->
</header>
<!-- END OF HEADER -->

<section>
    <h1 class="title">Watch your favorite animal online</h1>
    <p class="text">Explore the exciting and mysterious world of wild animals in a natural setting without leaving your
        home.</p>
    <button class="button">View live cam <img src="../../assets/icons/arrow-right.svg" alt="Right Arrow"></button>
</section>
</body>
</html>
