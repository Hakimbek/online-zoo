<main id="main">
    <section class="signup">
        <h2>Registration</h2>
        <form action="#" class="contact__form" id="contact-form">
            <div class="contact__form-group">
                <label for="login"><span>*</span> Login</label>
                <input required id="login" type="text" placeholder="Login">
                <span class="error-text"></span>
            </div>
            <div class="contact__form-group">
                <label for="name"><span>*</span> Name</label>
                <input required id="name" type="text" placeholder="Name">
                <span class="error-text"></span>
            </div>
            <div class="contact__form-group">
                <label for="email"><span>*</span> Email</label>
                <input required id="email" type="text" placeholder="Email">
                <span class="error-text"></span>
            </div>
            <div class="contact__form-group">
                <label for="password"><span>*</span> Password</label>
                <input required id="password" type="text" placeholder="Password">
                <span class="error-text"></span>
            </div>
            <div class="contact__form-group">
                <label for="confirmPassword"><span>*</span> Confirm Password</label>
                <input required id="confirmPassword" type="text" placeholder="Confirm Password">
                <span class="error-text"></span>
            </div>
            <button type="button" id="submit-btn" class="contact__form-button" disabled>Register</button>
        </form>
        <p id="signup-error"></p>
    </section>
</main>
